name: 发布手势太阳系

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: Gesture-Solar-System-GitHub
    steps:
      - name: 获取项目
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Gesture-Solar-System-GitHub/package-lock.json
      - name: 读取 Pages 地址
        id: pages
        uses: actions/configure-pages@v5
      - name: 安装依赖
        run: npm ci
      - name: 验证手势逻辑
        run: npm test
      - name: 构建网页
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base "$PAGES_BASE_PATH/"
      - name: 上传网页产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: Gesture-Solar-System-GitHub/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
